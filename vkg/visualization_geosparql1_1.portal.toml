title="ATKIS VKG"

[[tabGroups]]
name="Example"

[[tabGroups.tabs]]
name="Largest fruit and nut area in Germany"
query = """
# VEG01: Find area with most fruit and nut plantations
PREFIX : <http://example.org/ontologies/atkis#>
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
PREFIX geof: <http://www.opengis.net/def/function/geosparql/>

SELECT ?transformedGeom ?transformedGeomColor WHERE {
  ?x a :Agricultural .
  OPTIONAL {?x rdfs:label ?name .}

  # Find fruit and nut plantations
  ?x :vegetationFeature [rdfs:label ?fruitNutPlantation ] .
  FILTER(LANG(?fruitNutPlantation) = "de" && STR(?fruitNutPlantation) = "Obst- und Nussplantage")

  ?x geo:hasGeometry/geo:asWKT ?xGeom .
  BIND(geof:transform(?xGeom, <http://www.opengis.net/def/crs/OGC/1.3/CRS84>) AS ?transformedGeom)
  BIND("jet,0.8" AS ?transformedGeomColor)

  # Square kilometres
  BIND(geof:metricArea(?xGeom)/1000000 AS ?fruitNutMetricArea) .
}
ORDER BY DESC(?fruitNutMetricArea)
LIMIT 1
"""